<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.layout == 'book' %}{{ page.title }} · {% endif %}Library · {{ site.title }}</title>
  <meta name="description" content="{{ page.takeaway | default: 'Books Mingcong Tang has been reading, with notes and reflections.' | strip_html | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/library.css' | relative_url }}">
</head>
<body class="library">
  <header class="lib-nav">
    <div class="lib-nav-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">Mingcong Tang</a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/library/' | relative_url }}" aria-current="page">Library</a>
      </nav>
    </div>
  </header>

  <!-- The tree in the background: drawn and grown by assets/tree.js -->
  <div class="tree-bg" aria-hidden="true">
    <svg viewBox="0 0 600 1000" preserveAspectRatio="xMidYMax meet"></svg>
  </div>

  <main class="lib-main">
    <div class="lib-column">
      {{ content }}
      <footer class="lib-footer">
        <p>© {{ site.time | date: '%Y' }} Mingcong Tang</p>
      </footer>
    </div>
  </main>

  <script src="{{ '/assets/tree.js' | relative_url }}" defer></script>
</body>
</html>
