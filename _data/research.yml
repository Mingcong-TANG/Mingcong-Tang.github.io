statement: >-
  I study how people learn from emotional experience (learning the value of outcomes,
  inferring their own affective states, and using both to regulate emotion) and how
  individual differences in these learning processes, shaped by life experience and
  changed by treatment, give rise to the heterogeneity of psychopathology.

# Research themes: change the names and one-line descriptions freely.
themes:
